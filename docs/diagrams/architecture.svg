<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="SmartPV Support Agent 架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .band { font: 600 12px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; fill: #94a3b8; letter-spacing: .06em; }
      .box-title { font: 600 14px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; fill: #0f172a; }
      .box-sub { font: 12px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; fill: #475569; }
      .box-mono { font: 11.5px 'Cascadia Mono', Consolas, monospace; fill: #334155; }
      .title { font: 700 20px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 12.5px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>

  <text class="title" x="24" y="34">SmartPV Support Agent · 光伏电站技术支持</text>
  <text class="subtitle" x="24" y="56">模型只提出工具申请；允不允许、参数对不对、要不要人工确认，全部由服务端判定</text>

  <!-- ============ 入口层 ============ -->
  <text class="band" x="24" y="92">入口</text>
  <rect x="110" y="76" width="276" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="box-title" x="248" y="98" text-anchor="middle">本地客户端</text>
  <text class="box-sub" x="248" y="114" text-anchor="middle">static/index.html</text>

  <rect x="408" y="76" width="276" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="box-title" x="546" y="98" text-anchor="middle">Swagger / HTTP</text>
  <text class="box-sub" x="546" y="114" text-anchor="middle">docs/api_examples.http</text>

  <rect x="706" y="76" width="276" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text class="box-title" x="844" y="98" text-anchor="middle">命令行</text>
  <text class="box-sub" x="844" y="114" text-anchor="middle">smartpv-agent version | doctor | serve</text>

  <line x1="248" y1="122" x2="248" y2="146" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="546" y1="122" x2="546" y2="146" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="844" y1="122" x2="844" y2="146" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ 接入层 ============ -->
  <text class="band" x="24" y="162">接入</text>
  <rect x="110" y="146" width="872" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="box-title" x="126" y="168">FastAPI</text>
  <text class="box-sub" x="196" y="168">/chat · /tickets · /documents · /health · /evaluations</text>

  <rect x="126" y="178" width="268" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text class="box-title" x="260" y="198" text-anchor="middle">按用户限流</text>
  <text class="box-sub" x="260" y="215" text-anchor="middle">固定窗口；被拒不建会话、不调模型</text>

  <rect x="412" y="178" width="268" height="46" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.1"/>
  <text class="box-title" x="546" y="198" text-anchor="middle">提示词注入拦截</text>
  <text class="box-sub" x="546" y="215" text-anchor="middle">命中 → blocked，模型一次都不调用</text>

  <rect x="698" y="178" width="268" height="46" rx="7" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.1"/>
  <text class="box-title" x="832" y="198" text-anchor="middle">语料范围判据</text>
  <text class="box-sub" x="832" y="215" text-anchor="middle">命中 → needs_clarification，追问而非编造</text>

  <line x1="546" y1="236" x2="546" y2="262" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ 决策层 ============ -->
  <text class="band" x="24" y="278">决策</text>
  <rect x="110" y="262" width="500" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text class="box-title" x="126" y="284">Agent Loop</text>
  <text class="box-sub" x="126" y="303">最多 5 轮：模型申请 → 服务端校验 → 执行 → 结果回填</text>
  <text class="box-sub" x="126" y="322">工具独立超时 10 秒；同一工具同参数连续失败 2 次即不再放行</text>
  <text class="box-sub" x="126" y="341">失败按 error_kind 分七类；轮数用尽时去掉工具再问一次</text>

  <rect x="628" y="262" width="354" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text class="box-title" x="644" y="284">模型（可替换）</text>
  <text class="box-sub" x="644" y="303">有 llm_* 三项 → 远程 OpenAI 兼容接口</text>
  <text class="box-sub" x="644" y="322">否则 → 本地规则模型 RuleBasedLocalModel</text>
  <text class="box-sub" x="644" y="341">配了密钥但调用失败 → 明确降级，不偷偷退回规则模型</text>

  <line x1="610" y1="292" x2="628" y2="292" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="628" y1="318" x2="610" y2="318" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="628" y="366" width="354" height="46" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="box-title" x="644" y="386">LangGraph 路由图</text>
  <text class="box-sub" x="644" y="403">五分支条件边；可挂检查点、中断后同 thread_id 续跑</text>
  <line x1="805" y1="354" x2="805" y2="366" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ============ 能力层 ============ -->
  <text class="band" x="24" y="446">能力</text>
  <rect x="110" y="430" width="390" height="102" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
  <text class="box-title" x="126" y="452">混合检索</text>
  <text class="box-sub" x="126" y="471">单字 0.30 + 二元字组 0.35 + 语义向量 0.35</text>
  <text class="box-sub" x="126" y="490">语义分按词面覆盖率打折；库里向量维度不符时记 0 并告警</text>
  <text class="box-sub" x="126" y="509">行业标签只做加减分，不做硬过滤</text>
  <text class="box-sub" x="126" y="526">依据跨版本时并列返回，由现场确认</text>

  <rect x="516" y="430" width="286" height="102" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
  <text class="box-title" x="532" y="452">工具白名单</text>
  <text class="box-mono" x="532" y="472">query_device(sn)</text>
  <text class="box-mono" x="532" y="490">safe_calculate(expression)</text>
  <text class="box-mono" x="532" y="508">create_ticket(...) ← 写操作</text>
  <text class="box-mono" x="532" y="526">search_knowledge_base(query)</text>

  <rect x="818" y="430" width="164" height="102" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
  <text class="box-title" x="834" y="452">检索缓存</text>
  <text class="box-sub" x="834" y="471">进程内 / Redis</text>
  <text class="box-sub" x="834" y="490">失败即熔断降级</text>
  <text class="box-sub" x="834" y="509">按语料代次失效</text>
  <text class="box-sub" x="834" y="526">不可用只变慢</text>

  <line x1="300" y1="354" x2="300" y2="430" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ 存储层 ============ -->
  <text class="band" x="24" y="578">存储</text>
  <rect x="110" y="556" width="200" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="box-title" x="210" y="578" text-anchor="middle">SQLite</text>
  <text class="box-sub" x="210" y="596" text-anchor="middle">PostgreSQL 方言可用</text>
  <text class="box-sub" x="210" y="611" text-anchor="middle">pgvector 未接 ANN 索引</text>

  <rect x="326" y="556" width="200" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="box-title" x="426" y="578" text-anchor="middle">会话与消息</text>
  <text class="box-sub" x="426" y="596" text-anchor="middle">按 user_id 隔离</text>
  <text class="box-sub" x="426" y="611" text-anchor="middle">历史回放带引用</text>

  <rect x="542" y="556" width="200" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="box-title" x="642" y="578" text-anchor="middle">审计日志</text>
  <text class="box-sub" x="642" y="596" text-anchor="middle">拦截与工具调用</text>
  <text class="box-sub" x="642" y="611" text-anchor="middle">可轮转清理</text>

  <rect x="758" y="556" width="224" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="box-title" x="870" y="578" text-anchor="middle">确认令牌消费表</text>
  <text class="box-sub" x="870" y="596" text-anchor="middle">token_hash 主键，唯一约束判重放</text>
  <text class="box-sub" x="870" y="611" text-anchor="middle">与工单同一事务，只存哈希</text>

  <line x1="546" y1="532" x2="546" y2="556" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============ 旁路 ============ -->
  <text class="band" x="24" y="660">旁路</text>
  <rect x="110" y="638" width="420" height="46" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="box-title" x="126" y="658">MCP Server（旁路，未接主链路）</text>
  <text class="box-sub" x="126" y="675">stdio JSON-RPC：Tool / Resource / Prompt 各一，只读不写</text>

  <rect x="546" y="638" width="436" height="46" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text class="box-title" x="562" y="658">离线分层评测</text>
  <text class="box-sub" x="562" y="675">检索 / 工具选择 / 最终回答；声明哪层评哪层，复用线上判定代码</text>
</svg>
